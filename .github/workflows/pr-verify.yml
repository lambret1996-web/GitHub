name: PR代码校验，
run-name: PR校验 ${{ github.head_ref }}
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 恢复SPM依赖缓存
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 安装XcodeGen
        run: brew install xcodegen

      - name: 使用XcodeGen生成项目
        run: xcodegen generate

      - name: 安装SwiftLint
        run: brew install swiftlint

      - name: SwiftLint静态代码检查
        run: swiftlint lint --strict

      - name: 模拟器编译校验（不打包）
        run: xcodebuild build -scheme GitHubClient -destination 'platform=iOS Simulator,name=iPhone 15' -minimum-deployment-target 16.5

      - name: 执行单元测试
        run: xcodebuild test -scheme GitHubClient -destination 'platform=iOS Simulator,name=iPhone 15' -minimum-deployment-target 16.5
