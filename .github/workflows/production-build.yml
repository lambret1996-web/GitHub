name: 发布构建流水线
run-name: 构建发布 ${{ github.ref_name }}
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      overrideVersion:
        description: 手动指定完整版本号（留空自动补丁+1）
        required: false
        default: ''

env:
  SCHEME_NAME: GitHubClient
  MIN_IOS_VERSION: 16.5
  PROJECT_YML: project.yml

jobs:
  buildRelease:
    runs-on: macos-14
    steps:
      - name: 检出完整代码（包含git历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 恢复SPM缓存
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 安装工具链 XcodeGen / SwiftLint
        run: |
          brew install xcodegen swiftlint
          brew list

      - name: XcodeGen生成项目
        run: xcodegen generate

      - name: SwiftLint全量代码校验
        run: swiftlint lint --strict

      - name: 单元测试
        run: xcodebuild test -scheme ${{ env.SCHEME_NAME }} -destination 'platform=iOS Simulator,name=iPhone 15' -minimum-deployment-target ${{ env.MIN_IOS_VERSION }}

      - name: 版本号自动处理
        id: version_step
        run: |
          #!/bin/zsh
          set -e
          if [[ -n "${{ github.event.inputs.overrideVersion }}" ]]; then
            NEW_VER="${{ github.event.inputs.overrideVersion }}"
          else
            # 读取project.yml当前版本
            OLD_VER=$(grep "version:" ${{ env.PROJECT_YML }} | head -n1 | awk '{print $2}')
            IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VER"
            PATCH=$((PATCH + 1))
            NEW_VER="$MAJOR.$MINOR.$PATCH"
          fi
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_ENV
          echo "old=$OLD_VER"
          echo "new=$NEW_VER"

          # 修改project.yml版本字段
          sed -i '' "s/version: .*/version: $NEW_VER/" ${{ env.PROJECT_YML }}

          # 追加更新日志到README.md
          TODAY=$(date +"%Y-%m-%d")
          echo -e "\n## v$NEW_VER ($TODAY)\n- CI自动构建发布" >> README.md

          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_OUTPUT

      - name: 重新生成项目（版本已更新）
        run: xcodegen generate

      - name: Xcode Archive 归档
        run: xcodebuild archive -scheme ${{ env.SCHEME_NAME }} -archivePath ./build/GitHubClient.xcarchive -destination generic/platform=iOS -minimum-deployment-target ${{ env.MIN_IOS_VERSION }}

      - name: 导出未签名IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/GitHubClient.xcarchive \
            -exportPath ./output \
            -exportOptionsPlist exportOptions.plist
        # exportOptions.plist 需要放在仓库根目录，配置：method=development，signingStyle=manual，不签名

      - name: 计算IPA SHA256
        id: hash_step
        run: |
          IPA_FILE=$(ls ./output/*.ipa)
          SHA=$(shasum -a 256 "$IPA_FILE" | awk '{print $1}')
          echo "IPA_SHA256=$SHA" >> $GITHUB_ENV
          echo "$SHA  $(basename $IPA_FILE)" > ./output/sha256sum.txt

      - name: 上传产物Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 构建产物-v${{ env.NEW_VERSION }}
          path: ./output/
          retention-days: 90

      - name: 提交版本变更到仓库
        run: |
          git config --global user.name "CI自动机器人"
          git config --global user.email "ci@github.com"
          git add ${{ env.PROJECT_YML }} README.md
          git commit -m "[自动版本更新] v${{ env.NEW_VERSION }}"
          git push

      - name: 创建GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }} 发布包
          body: |
            ### 构建信息
            - 最低系统：iOS ${{ env.MIN_IOS_VERSION }}
            - 构建环境：Xcode15.4 macOS runner
            - IPA SHA256：`${{ env.IPA_SHA256 }}`

            ### 更新日志
            CI流水线自动发布版本。
          files: ./output/*.ipa
