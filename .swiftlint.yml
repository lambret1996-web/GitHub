# SwiftLint 项目规范配置，全汉化项目专用
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - redundant_type_annotation
  - unused_import
  - vertical_whitespace

excluded:
  - Carthage
  - Pods
  - .build
  - build
  - output

# 强制规则
force_unwrapping: error
unused_import: error
deprecated_apis: error # 禁止使用废弃API

# 自定义规则：尺寸代码必须带注释说明用途
custom_rules:
  dimension_comment:
    name: 尺寸代码缺少注释
    regex: '\.(frame|padding|font|cornerRadius|spacing|lineHeight)\(.*\)'
    match_kinds:
      - identifier
      - argument
    message: 所有尺寸相关代码行必须添加 // 注释说明视觉效果/作用
    severity: error

# 命名规范：推荐中文语义命名，不强制英文驼峰
identifier_name:
  excluded:
    - id
  min_length:
    error: 1
