opt_in_rules:
  - force_unwrapping
  - unused_import
  - deprecated_apis

excluded:
  - Pods
  - .build
  - Carthage
  - DerivedData

# ========== 临时禁用规则数组（本次报错的三条）==========
disabled_rules:
  - trailing_whitespace
  - legacy_swiftui_aspect_ratio
  - line_length
# =======================================================

# 核心强制规则
force_unwrapping: error
unused_import: error
deprecated_apis: error

# 自定义规则：检测尺寸代码缺少注释（项目核心约束，不能关闭）
custom_rules:
  dimension_comment:
    name: 尺寸代码缺少注释
    regex: '\.(frame|padding|font|cornerRadius|spacing|lineHeight)\(.*\)'
    match_kinds:
      - identifier
    message: 所有尺寸相关代码行，必须追加//注释说明尺寸作用与效果
    severity: error

identifier_name:
  min_length:
    error: 2
  max_length:
    warning: 60
    error: 100
  allowed_symbols: ["_"]
