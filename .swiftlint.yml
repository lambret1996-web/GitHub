opt_in_rules:
  - force_unwrapping
  - unused_import
  - deprecated_apis

excluded:
  - Pods
  - .build
  - Carthage
  - DerivedData

# 核心强制规则
force_unwrapping: error
unused_import: error
deprecated_apis: error

# ========== 临时关闭本次报错的规则，用于CI验收，后续可按需重新开启 ==========
trailing_whitespace: disabled
legacy_swiftui_aspect_ratio: disabled
line_length: disabled
# ==========================================================================

# 自定义规则：检测尺寸代码缺少注释（项目核心约束，不能关闭）
custom_rules:
  dimension_comment:
    name: 尺寸代码缺少注释
    regex: '\.(frame|padding|font|cornerRadius|spacing|lineHeight)\(.*\)'
    match_kinds:
      - identifier
    message: 所有尺寸相关代码行，必须追加//注释说明尺寸作用与效果
    severity: error

identifier_name:
  min_length:
    error: 2
  max_length:
    warning: 60
    error: 100
  allowed_symbols: ["_"]
